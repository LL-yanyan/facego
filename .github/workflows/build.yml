name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Linux 构建 Client：apt 安装 Qt6 / OpenCV
  #
  # Server 依赖第三方 SeetaFace6（中科视拓官方仅通过网盘分发预编译二进制，
  # 无公开源码仓库 / 包管理器源），CI 无法自动、可靠地获取，因此 CI 覆盖
  # Client；Server 已在本地（Windows + MinGW / 本地 Linux）实际构建验证。
  #
  # 如需在 CI 中同时构建 Server：请自行准备 SeetaFace6 SDK，在下方 Configure
  # 步骤去掉 -DFACEGO_BUILD_SERVER=OFF，并通过 CMAKE_PREFIX_PATH 指向 SDK。
  # ------------------------------------------------------------
  linux-build-client:
    name: Build Client on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FaceGo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            libgl1-mesa-dev libopencv-dev

      - name: Configure (Client only)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFACEGO_BUILD_SERVER=OFF \
            -DFACEGO_BUILD_CLIENT=ON

      - name: Build Client
        run: cmake --build build

      - name: Show build artifacts
        run: ls -R build/bin || true
